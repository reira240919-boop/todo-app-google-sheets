<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Todoリスト{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <h1>Todoリスト</h1>
    <nav>
      <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' else '' }}">一覧</a>
      <a href="{{ url_for('add') }}" class="{{ 'active' if request.endpoint == 'add' else '' }}">＋新規追加</a>
    </nav>
  </header>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <div id="loading-overlay" class="loading-overlay" hidden>
    <div class="spinner"></div>
  </div>

  <script>
    (function () {
      var overlay = document.getElementById("loading-overlay");

      document.querySelectorAll("form").forEach(function (form) {
        form.addEventListener("submit", function (e) {
          var confirmMessage = form.getAttribute("data-confirm");
          if (confirmMessage && !window.confirm(confirmMessage)) {
            e.preventDefault();
            return;
          }
          if (typeof form.reportValidity === "function" && !form.reportValidity()) {
            return;
          }
          overlay.hidden = false;
          var btn = form.querySelector("button[type=submit], button:not([type])");
          if (btn) {
            btn.disabled = true;
          }
        });
      });

      document.querySelectorAll("a[href]").forEach(function (link) {
        link.addEventListener("click", function (e) {
          if (link.target === "_blank" || e.metaKey || e.ctrlKey || e.shiftKey) {
            return;
          }
          overlay.hidden = false;
        });
      });
    })();
  </script>
</body>
</html>
