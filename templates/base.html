<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}毎日やること{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <!-- ホーム画面に追加したときのアイコンと名前 -->
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='icons/favicon-32.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <meta name="apple-mobile-web-app-title" content="毎日やること">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
</head>
<body>
  <header class="topbar">
    <h1>毎日やること</h1>
    <nav>
      <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' else '' }}">ホーム</a>
      <a href="{{ url_for('report') }}" class="{{ 'active' if request.endpoint == 'report' else '' }}">日報</a>
      <a href="{{ url_for('goals') }}" class="{{ 'active' if request.endpoint == 'goals' else '' }}">目標</a>
      <a href="{{ url_for('settings') }}" class="{{ 'active' if request.endpoint == 'settings' else '' }}">設定</a>
    </nav>
  </header>

  <main class="container {% block container_class %}{% endblock %}">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <div id="loading-overlay" class="loading-overlay" hidden>
    <div class="loading-box" role="status" aria-live="polite">
      <div class="spinner"></div>
      <p class="loading-text" id="loading-text">通信中…</p>
    </div>
  </div>

  <script>
    // 通信中は画面の真ん中に「保存中…」などを出して、押せたことがわかるようにする
    var overlay = document.getElementById("loading-overlay");
    function showLoading(text) {
      document.getElementById("loading-text").textContent = text || "通信中…";
      overlay.hidden = false;
    }
    function hideLoading() {
      overlay.hidden = true;
    }

    (function () {

      document.querySelectorAll("form").forEach(function (form) {
        form.addEventListener("submit", function (e) {
          var confirmMessage = form.getAttribute("data-confirm");
          if (confirmMessage && !window.confirm(confirmMessage)) {
            e.preventDefault();
            return;
          }
          if (typeof form.reportValidity === "function" && !form.reportValidity()) {
            return;
          }
          showLoading(form.getAttribute("data-loading") || "保存中…");
          var btn = form.querySelector("button[type=submit], button:not([type])");
          if (btn) {
            btn.disabled = true;
          }
        });
      });

      document.querySelectorAll("a[href]").forEach(function (link) {
        link.addEventListener("click", function (e) {
          if (link.target === "_blank" || e.metaKey || e.ctrlKey || e.shiftKey || link.getAttribute("href").charAt(0) === "#") {
            return;
          }
          showLoading("読み込み中…");
        });
      });

      // 「戻る」で前の画面に戻ったとき、通信中の表示や押せないボタンが残らないようにする
      window.addEventListener("pageshow", function (e) {
        if (!e.persisted) return;
        hideLoading();
        document.querySelectorAll("form button:disabled").forEach(function (btn) {
          btn.disabled = false;
        });
      });
    })();
  </script>

  {% block scripts %}{% endblock %}
</body>
</html>
