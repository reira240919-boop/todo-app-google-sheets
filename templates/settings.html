{% extends "base.html" %}
{% block title %}設定 | 毎日やること{% endblock %}
{% block content %}
  <h2>設定</h2>

  <form method="post" class="todo-form">
    <label>
      <span class="field-label">{{ month_label }}の目標</span>
      <textarea name="monthly_goal" rows="6" maxlength="3000" placeholder="今月の目標を書く">{{ monthly_goal }}</textarea>
      <span class="field-hint">月が変わると、前の月の目標が最初から入っています。</span>
    </label>

    <label>
      <span class="field-label">明日意識すること</span>
      <textarea name="tomorrow_awareness" rows="6" maxlength="3000" placeholder="毎日の日報に入る共通の文">{{ tomorrow_awareness }}</textarea>
      <span class="field-hint">毎日の日報に同じ文が入ります。</span>
    </label>

    <div class="form-actions">
      <button type="submit">保存する</button>
    </div>
  </form>
{% endblock %}
